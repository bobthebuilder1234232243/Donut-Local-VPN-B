name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: "22"

jobs:
  tunnel-test:
    name: Tunnel integration test
    uses: ./.github/workflows/test-tunnel.yml

  release:
    name: Draft release
    needs: tunnel-test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Read and check version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node -e "const p=require('./package.json'),t=require('./src-tauri/tauri.conf.json');if(p.version!==t.version){console.error('package.json '+p.version+' does not match tauri.conf.json '+t.version);process.exit(1)}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create or reuse draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          sed "s/{{version}}/$VERSION/g" .github/release-notes.md > release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft --title "Donut Local VPN v$VERSION" --notes-file release-notes.md
          else
            gh release create "$TAG" --draft --title "Donut Local VPN v$VERSION" --notes-file release-notes.md
          fi

  bundle:
    name: Build ${{ matrix.platform }}
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            extra: ""
            bundles: nsis
            bundle_path: src-tauri/target/release/bundle
          - platform: macos
            os: macos-latest
            extra: "--target universal-apple-darwin"
            bundles: app,dmg
            bundle_path: src-tauri/target/universal-apple-darwin/release/bundle
          - platform: linux
            os: ubuntu-22.04
            extra: ""
            bundles: deb,appimage
            bundle_path: src-tauri/target/release/bundle
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.platform }}

      - run: npm ci

      - name: Check signing key
        shell: bash
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. Add it under Settings -> Secrets and variables -> Actions, together with TAURI_SIGNING_PRIVATE_KEY_PASSWORD."
            exit 1
          fi

      - name: Build bundles
        shell: bash
        run: npm run tauri build -- ${{ matrix.extra }} --bundles ${{ matrix.bundles }}

      - name: Collect, rename and sign assets
        shell: bash
        run: node .github/scripts/release-assets.mjs collect ${{ matrix.platform }} ${{ matrix.bundle_path }}

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          path: release-assets
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [release, bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Merge the update manifest
        run: node .github/scripts/release-assets.mjs merge release

      - name: Upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$TAG" release/* --clobber

      - name: Publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release edit "$TAG" --draft=false
