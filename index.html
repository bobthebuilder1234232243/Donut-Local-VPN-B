<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donut Local VPN</title>
    <link rel="icon" href="/src-tauri/icons/32x32.png" />
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div class="app" id="app" data-phase="off">
      <header class="titlebar" data-tauri-drag-region>
        <div class="brand" data-tauri-drag-region>
          <span class="mark">
            <svg viewBox="0 0 32 32" aria-hidden="true" class="logo">
              <path
                d="M16 2.2a13.8 13.8 0 1 0 0 27.6 13.8 13.8 0 0 0 0-27.6Zm0 9.1a4.7 4.7 0 1 1 0 9.4 4.7 4.7 0 0 1 0-9.4Z"
                fill="#c97a3a"
                fill-rule="evenodd"
              />
              <path
                d="M16 4.7a11.3 11.3 0 1 0 0 22.6 11.3 11.3 0 0 0 0-22.6Zm0 6.6a4.7 4.7 0 1 1 0 9.4 4.7 4.7 0 0 1 0-9.4Z"
                fill="#2bb8b2"
                fill-rule="evenodd"
              />
              <rect x="7.4" y="9.3" width="4.2" height="1.6" rx="0.8" fill="#ffffff" transform="rotate(-24 7.4 9.3)" />
              <rect x="20.4" y="8.1" width="4.2" height="1.6" rx="0.8" fill="#f59e0b" transform="rotate(18 20.4 8.1)" />
              <rect x="6.2" y="16.4" width="3.4" height="1.5" rx="0.75" fill="#f59e0b" transform="rotate(64 6.2 16.4)" />
              <rect x="22.4" y="16.6" width="3.6" height="1.5" rx="0.75" fill="#ffffff" transform="rotate(-58 22.4 16.6)" />
              <rect x="10.4" y="22.4" width="3.6" height="1.5" rx="0.75" fill="#3b82f6" transform="rotate(12 10.4 22.4)" />
              <rect x="18.4" y="22.6" width="3.6" height="1.5" rx="0.75" fill="#ffffff" transform="rotate(-14 18.4 22.6)" />
              <path
                d="M16 8.4 21.1 10.4v3.9c0 3.2-2.1 5.5-5.1 6.7-3-1.2-5.1-3.5-5.1-6.7v-3.9L16 8.4Z"
                fill="#e8f4ff"
              />
              <rect x="14.8" y="13.2" width="2.4" height="3.4" rx="0.7" fill="#0c4a6e" />
              <path d="M15.3 13.2v-1a1.7 1.7 0 0 1 3.4 0v1" fill="none" stroke="#0c4a6e" stroke-width="1" />
            </svg>
          </span>
          <span class="name" data-tauri-drag-region>Donut Local VPN</span>
        </div>
        <div class="actions">
          <button class="icon-btn" id="btn-settings" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h9M17 7h3M4 17h3M11 17h9" />
              <circle cx="15" cy="7" r="2" />
              <circle cx="9" cy="17" r="2" />
            </svg>
          </button>
          <button class="icon-btn" id="btn-hide" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12" /></svg>
          </button>
        </div>
      </header>

      <main class="home">
        <div class="dial">
          <div class="halo"></div>
          <span class="pulse"></span>
          <span class="pulse late"></span>
          <svg class="ring" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="98" /></svg>
          <svg class="spinner" viewBox="0 0 200 200" aria-hidden="true"><path d="M100 2A98 98 0 0 1 198 100" /></svg>
          <button class="power" id="btn-power" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3.5v8" />
              <path d="M6.7 6.6a7.5 7.5 0 1 0 10.6 0" />
            </svg>
          </button>
        </div>
        <h1 class="status" id="status-title" aria-live="polite"></h1>
        <p class="detail" id="status-detail" aria-live="polite"></p>
        <p class="profile" id="status-profile"></p>
        <section class="session" id="session" hidden>
          <div class="session-item"><span id="lbl-session-tunnel"></span><strong id="val-session-tunnel">—</strong></div>
          <div class="session-item"><span id="lbl-session-device"></span><strong id="val-session-device">—</strong></div>
          <div class="session-item"><span id="lbl-session-dpi"></span><strong id="val-session-dpi">—</strong></div>
          <div class="session-item"><span id="lbl-session-uptime"></span><strong id="val-session-uptime">—</strong></div>
          <div class="session-item"><span id="lbl-session-upload"></span><strong id="val-session-upload">—</strong></div>
          <div class="session-item"><span id="lbl-session-download"></span><strong id="val-session-download">—</strong></div>
        </section>
      </main>

      <footer class="footer">
        <label class="row">
          <span id="lbl-autostart"></span>
          <input class="switch" id="chk-autostart" type="checkbox" />
        </label>
      </footer>

      <section class="sheet" id="sheet" aria-hidden="true">
        <div class="sheet-head">
          <button class="icon-btn" id="btn-back" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6" /></svg>
          </button>
          <h2 id="lbl-settings"></h2>
        </div>

        <div class="sheet-body">
          <p class="pending" id="lbl-pending"></p>

          <details class="acc" id="acc-region">
            <summary>
              <span id="lbl-region"></span>
              <span class="val"><span id="val-region"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg></span>
            </summary>
            <div class="acc-body">
              <p class="hint" id="lbl-region-hint"></p>
              <div class="options" id="region"></div>
            </div>
          </details>

          <details class="acc" id="acc-dpi">
            <summary>
              <span id="lbl-dpi"></span>
              <span class="val"><span id="val-dpi"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg></span>
            </summary>
            <div class="acc-body">
              <label class="toggle">
                <span id="lbl-dpi-toggle"></span>
                <input class="switch" id="chk-dpi" type="checkbox" />
              </label>
              <p class="hint" id="lbl-dpi-hint"></p>
            </div>
          </details>

          <details class="acc" id="acc-network">
            <summary>
              <span id="lbl-network"></span>
              <span class="val"><span id="val-network"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg></span>
            </summary>
            <div class="acc-body">
              <p class="hint" id="lbl-network-hint"></p>
              <label class="field">
                <span id="lbl-tunnel-ip"></span>
                <input id="inp-tunnel-ip" type="text" spellcheck="false" autocomplete="off" />
              </label>
              <label class="field">
                <span id="lbl-device-ip"></span>
                <input id="inp-device-ip" type="text" spellcheck="false" autocomplete="off" />
              </label>
              <p class="field-error" id="lbl-network-error"></p>
              <button class="tool" id="btn-network-apply" type="button"></button>
            </div>
          </details>

          <details class="acc" id="acc-autoconnect">
            <summary>
              <span id="lbl-autoconnect"></span>
              <span class="val"><span id="val-autoconnect"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg></span>
            </summary>
            <div class="acc-body">
              <label class="toggle">
                <span id="lbl-autoconnect-toggle"></span>
                <input class="switch" id="chk-autoconnect" type="checkbox" />
              </label>
              <p class="hint" id="lbl-autoconnect-hint"></p>
            </div>
          </details>

          <details class="acc" id="acc-language">
            <summary>
              <span id="lbl-language"></span>
              <span class="val"><span id="val-language"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg></span>
            </summary>
            <div class="acc-body">
              <p class="hint" id="lbl-language-hint"></p>
              <div class="options" id="language"></div>
            </div>
          </details>

          <details class="acc" id="acc-theme">
            <summary>
              <span id="lbl-theme"></span>
              <span class="val"><span id="val-theme"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg></span>
            </summary>
            <div class="acc-body">
              <p class="hint" id="lbl-theme-hint"></p>
              <div class="options" id="theme"></div>
            </div>
          </details>

          <details class="acc" id="acc-vpn">
            <summary>
              <span id="lbl-vpn"></span>
              <span class="val"><span id="val-vpn"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg></span>
            </summary>
            <div class="acc-body">
              <label class="toggle">
                <span id="lbl-vpn-toggle"></span>
                <input class="switch" id="chk-vpn" type="checkbox" />
              </label>
              <p class="hint" id="lbl-vpn-hint"></p>
            </div>
          </details>

          <details class="acc" id="acc-notifications">
            <summary>
              <span id="lbl-notifications"></span>
              <span class="val"><span id="val-notifications"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg></span>
            </summary>
            <div class="acc-body">
              <label class="toggle">
                <span id="lbl-notify-toggle"></span>
                <input class="switch" id="chk-notifications" type="checkbox" />
              </label>
              <p class="hint" id="lbl-notifications-hint"></p>
            </div>
          </details>

          <details class="acc" id="acc-logs">
            <summary>
              <span id="lbl-logs"></span>
              <span class="val"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg></span>
            </summary>
            <div class="acc-body">
              <p class="hint" id="lbl-logs-hint"></p>
              <div class="levels" id="log-levels"></div>
              <div class="logs" id="log-list" role="log"></div>
              <p class="hint" id="lbl-log-empty" hidden></p>
              <div class="tools">
                <button class="tool" id="btn-copy-logs" type="button"></button>
                <button class="tool" id="btn-refresh-logs" type="button"></button>
              </div>
            </div>
          </details>

          <details class="acc" id="advanced">
            <summary>
              <span id="lbl-advanced"></span>
              <span class="val"><span id="val-advanced"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg></span>
            </summary>
            <div class="acc-body">
              <label class="toggle">
                <span id="lbl-selective"></span>
                <input class="switch" id="chk-selective" type="checkbox" />
              </label>
              <p class="hint" id="lbl-selective-hint"></p>
              <h3 id="lbl-sites"></h3>
              <p class="hint" id="lbl-sites-hint"></p>
              <div class="options" id="site-tiles"></div>
              <form class="add" id="add-form" autocomplete="off">
                <input id="add-input" type="text" spellcheck="false" />
                <button class="add-btn" id="btn-add" type="submit">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12" /></svg>
                </button>
              </form>
              <h3 id="lbl-help"></h3>
              <p class="hint" id="lbl-help-hint"></p>
              <div class="tools">
                <button class="tool" id="btn-diagnostics" type="button"></button>
                <button class="tool" id="btn-report" type="button"></button>
              </div>
            </div>
          </details>

          <details class="acc" id="acc-about">
            <summary>
              <span id="lbl-about"></span>
              <span class="val"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg></span>
            </summary>
            <div class="acc-body">
              <p class="hint about" id="lbl-about-text"></p>
            </div>
          </details>
        </div>

        <div class="sheet-foot">
          <button class="source" id="btn-source" type="button">
            <img class="donut" src="/src-tauri/icons/32x32.png" alt="" />
            <span>Donut Local VPN</span>
          </button>
          <button class="text-btn" id="btn-quit" type="button"></button>
        </div>
      </section>
    </div>
  </body>
</html>
